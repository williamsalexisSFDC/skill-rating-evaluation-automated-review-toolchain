---
name: CI

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install \
            openpyxl \
            playwright \
            google-api-python-client \
            google-auth-oauthlib \
            cryptography \
            pytest \
            pytest-cov \
            pre-commit \
            yamllint \
            flake8 \
            flake8-bugbear \
            flake8-cognitive-complexity

      - name: Detect changed YAML files
        id: yaml_changes
        run: |
          if git show --name-only --format="" HEAD | grep -qE '\.ya?ml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint YAML files
        if: steps.yaml_changes.outputs.changed == 'true'
        run: pre-commit run yamllint --all-files

      - name: Lint Python (flake8)
        run: flake8 scraping/ validation/ reporting/ approval/ lib/ tests/

      - name: Run tests with coverage gate
        run: |
          pytest tests/ \
            --cov=validate_skill_ratings \
            --cov=generate_review_artifacts \
            --cov=mass_approve_skills \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os

          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          total_rate = float(root.attrib.get("line-rate", 0)) * 100

          rows = []
          for cls in root.iter("class"):
              fname = cls.attrib.get("filename", "")
              if not fname:
                  continue
              lines = cls.findall(".//line")
              stmts = len(lines)
              miss = sum(1 for l in lines if l.attrib.get("hits", "0") == "0")
              rate = ((stmts - miss) / stmts * 100) if stmts else 100.0
              rows.append((fname, stmts, miss, rate))

          rows.sort(key=lambda r: r[0])
          gate = total_rate >= 90
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Coverage\n\n")
              f.write("| File | Stmts | Miss | Cover |\n")
              f.write("|------|------:|-----:|------:|\n")
              for fname, stmts, miss, rate in rows:
                  icon = "✅" if rate >= 90 else "⚠️"
                  f.write(f"| `{fname}` | {stmts} | {miss} | {icon} {rate:.0f}% |\n")
              f.write(f"\n**Total: {'✅' if gate else '❌'} {total_rate:.1f}%** (gate: ≥90%)\n")
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  auto-pr-and-merge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync dev forward if behind main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          BEHIND=$(git rev-list --count HEAD..origin/main)
          AHEAD=$(git rev-list --count origin/main..HEAD)
          if [ "$BEHIND" -gt 0 ] && [ "$AHEAD" -eq 0 ]; then
            echo "dev is $BEHIND commit(s) behind main, 0 ahead -- fast-forwarding"
            git merge origin/main --ff-only
            git push origin HEAD:dev
          elif [ "$BEHIND" -gt 0 ]; then
            echo "dev is $BEHIND behind and $AHEAD ahead of main -- diverged, PR will merge both"
          else
            echo "dev is up to date with main"
          fi

      - name: Create PR to main if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(gh api repos/${{ github.repository }}/compare/main...dev --jq '.ahead_by')
          if [ "$AHEAD" -eq 0 ]; then
            echo "dev has no commits ahead of main -- no PR needed"
            exit 0
          fi
          EXISTING=$(gh pr list --base main --head dev --state open --json number --jq 'length')
          if [ "$EXISTING" -eq 0 ]; then
            {
              echo "Automated PR: all tests passed with >=90% coverage."
              echo ""
              echo "**Triggered by:** push to \`dev\`"
              echo "**Status:** tests passed, coverage gate met"
              echo ""
              echo "Generated with Claude Code"
            } > /tmp/pr_body.txt
            gh pr create \
              --base main \
              --head dev \
              --title "dev -> main: automated merge (tests passed)" \
              --body-file /tmp/pr_body.txt
          else
            echo "PR already exists -- skipping create"
          fi

      - name: Merge PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tests already passed (needs: test guarantees it) so merge directly.
          # --auto would wait for a redundant PR-triggered CI re-run and silently
          # no-op if "Allow auto-merge" isn't enabled in repo settings.
          PR_NUM=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUM" ]; then
            gh pr merge "$PR_NUM" --merge \
              && echo "Merged PR #$PR_NUM to main" \
              || echo "Merge skipped (already merged or no permission)"
          else
            echo "No open PR found -- already merged or nothing to merge"
          fi
